services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-token_gateway}
      POSTGRES_USER: ${POSTGRES_USER:-token_gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-token_gateway}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-token_gateway} -d ${POSTGRES_DB:-token_gateway}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-r2dbc:postgresql://postgres:5432/token_gateway}
      FLYWAY_URL: ${FLYWAY_URL:-jdbc:postgresql://postgres:5432/token_gateway}
      POSTGRES_USER: ${POSTGRES_USER:-token_gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-token_gateway}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me-admin-key}
      ALLOWED_REGIONS: ${ALLOWED_REGIONS:-NZ,AU,US,CA,GB,IE,JP,KR,SG,IN,DE,FR,NL,SE,NO,DK,FI}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8080"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres-data:
