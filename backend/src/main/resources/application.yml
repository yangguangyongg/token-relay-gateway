server:
  port: 8080

spring:
  application:
    name: token-relay-gateway
  r2dbc:
    url: ${DATABASE_URL:r2dbc:postgresql://localhost:5432/token_gateway}
    username: ${POSTGRES_USER:token_gateway}
    password: ${POSTGRES_PASSWORD:token_gateway}
  flyway:
    enabled: true
    url: ${FLYWAY_URL:jdbc:postgresql://localhost:5432/token_gateway}
    user: ${POSTGRES_USER:token_gateway}
    password: ${POSTGRES_PASSWORD:token_gateway}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

gateway:
  admin-api-key: ${ADMIN_API_KEY:change-me-admin-key}
  allowed-regions: ${ALLOWED_REGIONS:NZ,AU,US,CA,GB,IE,JP,KR,SG,IN,DE,FR,NL,SE,NO,DK,FI}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
  default-provider-timeout-seconds: 120
